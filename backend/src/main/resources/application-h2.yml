# Run without Docker: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Data lives in memory and disappears when the app stops.
spring:
  datasource:
    url: jdbc:h2:mem:labflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
